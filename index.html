<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="同步翻譯">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <title>🌍 同步翻譯</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #1a1a2e;
      color: #fff;
      min-height: 100vh;
      padding-bottom: 40px;
    }
    header {
      background: #16213e;
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid #0f3460;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 20px; color: #e94560; }
    header p  { font-size: 13px; color: #a8b2d8; margin-top: 4px; }

    main { padding: 16px; max-width: 600px; margin: 0 auto; }

    .toggle-btn {
      width: 100%;
      background: #0f3460;
      border: none;
      border-radius: 14px;
      padding: 16px;
      color: #e94560;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 16px;
      display: block;
    }
    .toggle-hint { color: #a8b2d8; font-size: 12px; margin-top: 4px; display: block; }

    .card {
      background: #16213e;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .card-label {
      color: #a8b2d8;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    textarea {
      width: 100%;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 16px;
      line-height: 1.6;
      resize: none;
      outline: none;
      min-height: 100px;
      font-family: inherit;
    }
    textarea::placeholder { color: #555; }

    .char-count {
      text-align: right;
      font-size: 12px;
      color: #666;
      margin-top: 6px;
    }
    .char-count.over { color: #e94560; }

    .row {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 12px;
    }
    button {
      border: none;
      border-radius: 10px;
      padding: 11px 22px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .clear-btn {
      background: transparent;
      border: 1px solid #a8b2d8;
      color: #a8b2d8;
    }
    .translate-btn {
      background: #e94560;
      color: #fff;
      min-width: 90px;
    }
    .translate-btn:disabled { opacity: 0.35; cursor: default; }

    .mic-btn {
      width: 100%;
      background: #16213e;
      border: 2px solid #4A90E2;
      color: #4A90E2;
      padding: 14px;
      font-size: 16px;
      border-radius: 10px;
      margin-bottom: 16px;
    }
    .mic-btn.recording {
      background: #e94560;
      border-color: #e94560;
      color: #fff;
    }

    .output-box {
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .output-text { font-size: 18px; line-height: 1.7; width: 100%; }
    .placeholder-text { color: #555; font-size: 15px; }

    .speak-btn {
      width: 100%;
      background: #0f3460;
      color: #4A90E2;
      padding: 13px;
      font-size: 16px;
      border-radius: 10px;
      margin-top: 14px;
    }

    .loader {
      width: 36px; height: 36px;
      border: 3px solid #333;
      border-top-color: #e94560;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hint {
      background: #0f3460;
      border-radius: 10px;
      padding: 14px;
      font-size: 13px;
      color: #a8b2d8;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <header>
    <h1>🌍 同步翻譯</h1>
    <p id="header-sub">挪威語 ⇄ 中文</p>
  </header>

  <main>
    <button class="toggle-btn" onclick="toggleDirection()">
      <span id="toggle-label">挪威語  ⇄  中文</span>
      <span class="toggle-hint">點擊切換翻譯方向</span>
    </button>

    <!-- 語音輸入按鈕 -->
    <button class="mic-btn" id="mic-btn" onclick="toggleMic()">🎤 點擊說話</button>

    <!-- 輸入區 -->
    <div class="card">
      <div class="card-label" id="from-label">挪威語</div>
      <textarea id="input-text" placeholder="輸入文字或點上方麥克風說話..." rows="4"
        oninput="updateCharCount()"></textarea>
      <div class="char-count" id="char-count">0 / 500</div>
      <div class="row">
        <button class="clear-btn" onclick="clearAll()">清除</button>
        <button class="translate-btn" id="translate-btn" onclick="doTranslate()" disabled>翻譯</button>
      </div>
    </div>

    <!-- 輸出區 -->
    <div class="card">
      <div class="card-label" id="to-label">中文</div>
      <div class="output-box" id="output-box">
        <span class="placeholder-text">翻譯結果會顯示在這裡</span>
      </div>
      <button class="speak-btn" id="speak-btn" onclick="speak()" style="display:none">
        🔊 朗讀翻譯
      </button>
    </div>

    <div class="hint">
      💡 加入主畫面：在 Safari 點選「分享」→「加入主畫面」，即可像 App 一樣使用
    </div>
  </main>

  <script>
    const LANGS = {
      NO_TO_ZH: { from: 'no', to: 'zh-TW', fromLabel: '挪威語', toLabel: '中文', speechFrom: 'nb-NO', speechTo: 'zh-TW' },
      ZH_TO_NO: { from: 'zh-TW', to: 'no', fromLabel: '中文', toLabel: '挪威語', speechFrom: 'zh-TW', speechTo: 'nb-NO' },
    };

    let direction = 'NO_TO_ZH';
    let isRecording = false;
    let isSpeaking = false;
    let recognition = null;
    let synth = window.speechSynthesis;
    let translatedText = '';

    function lang() { return LANGS[direction]; }

    function updateUI() {
      const l = lang();
      document.getElementById('header-sub').textContent = `${l.fromLabel} ⇄ ${l.toLabel}`;
      document.getElementById('toggle-label').textContent = `${l.fromLabel}  ⇄  ${l.toLabel}`;
      document.getElementById('from-label').textContent = l.fromLabel;
      document.getElementById('to-label').textContent = l.toLabel;
    }

    function toggleDirection() {
      if (isSpeaking) { synth.cancel(); isSpeaking = false; }
      direction = direction === 'NO_TO_ZH' ? 'ZH_TO_NO' : 'NO_TO_ZH';
      clearAll();
      updateUI();
    }

    function updateCharCount() {
      const text = document.getElementById('input-text').value;
      const el = document.getElementById('char-count');
      el.textContent = `${text.length} / 500`;
      el.className = 'char-count' + (text.length > 500 ? ' over' : '');
      document.getElementById('translate-btn').disabled = text.trim().length === 0 || text.length > 500;
    }

    function clearAll() {
      if (isSpeaking) { synth.cancel(); isSpeaking = false; updateSpeakBtn(); }
      document.getElementById('input-text').value = '';
      updateCharCount();
      document.getElementById('output-box').innerHTML = '<span class="placeholder-text">翻譯結果會顯示在這裡</span>';
      document.getElementById('speak-btn').style.display = 'none';
      translatedText = '';
    }

    async function doTranslate() {
      const text = document.getElementById('input-text').value.trim();
      if (!text || text.length > 500) return;

      document.getElementById('output-box').innerHTML = '<div class="loader"></div>';
      document.getElementById('speak-btn').style.display = 'none';
      translatedText = '';

      try {
        const mmFrom = lang().from.split('-')[0];
        const mmTo   = lang().to.split('-')[0];
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${mmFrom}|${mmTo}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (data.responseStatus !== 200) throw new Error(data.responseStatus);
        let result = data.responseData.translatedText;
        if (result.includes('%')) result = decodeURIComponent(result);

        translatedText = result;
        document.getElementById('output-box').innerHTML = `<div class="output-text">${result}</div>`;
        document.getElementById('speak-btn').style.display = 'block';
      } catch (e) {
        document.getElementById('output-box').innerHTML = `<span class="placeholder-text">翻譯失敗：${e.message}，請確認網路連線</span>`;
      }
    }

    function updateSpeakBtn() {
      const btn = document.getElementById('speak-btn');
      btn.textContent = isSpeaking ? '⏹ 停止朗讀' : '🔊 朗讀翻譯';
    }

    function speak() {
      if (isSpeaking) {
        synth.cancel();
        isSpeaking = false;
        updateSpeakBtn();
        return;
      }
      if (!translatedText) return;

      const utter = new SpeechSynthesisUtterance(translatedText);
      utter.lang = lang().speechTo;
      utter.rate = 0.9;
      utter.onstart = () => { isSpeaking = true; updateSpeakBtn(); };
      utter.onend = () => { isSpeaking = false; updateSpeakBtn(); };
      utter.onerror = () => { isSpeaking = false; updateSpeakBtn(); };
      synth.speak(utter);
    }

    function toggleMic() {
      if (isRecording) {
        stopMic();
      } else {
        startMic();
      }
    }

    function startMic() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('此瀏覽器不支援語音輸入，請使用 Safari');
        return;
      }
      recognition = new SpeechRecognition();
      recognition.lang = lang().speechFrom;
      recognition.continuous = false;
      recognition.interimResults = true;

      recognition.onstart = () => {
        isRecording = true;
        const btn = document.getElementById('mic-btn');
        btn.textContent = '🔴 錄音中，點擊停止';
        btn.className = 'mic-btn recording';
      };

      recognition.onresult = (e) => {
        const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
        document.getElementById('input-text').value = transcript;
        updateCharCount();
      };

      recognition.onend = () => {
        isRecording = false;
        const btn = document.getElementById('mic-btn');
        btn.textContent = '🎤 點擊說話';
        btn.className = 'mic-btn';
        // 自動翻譯
        const text = document.getElementById('input-text').value.trim();
        if (text) translate();
      };

      recognition.onerror = (e) => {
        isRecording = false;
        const btn = document.getElementById('mic-btn');
        btn.textContent = '🎤 點擊說話';
        btn.className = 'mic-btn';
        if (e.error !== 'no-speech') alert('語音辨識錯誤：' + e.error);
      };

      recognition.start();
    }

    function stopMic() {
      if (recognition) recognition.stop();
    }

    // Enter 鍵翻譯（桌面用）
    document.getElementById('input-text').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        translate();
      }
    });

    updateUI();
  </script>
</body>
</html>
